name: Auto-Update CinéFR Catalogs (FR)

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-catalogs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Build and enrich French HD catalogs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/build_catalogs.py

      - name: Validate catalogs with pytest
        run: pytest tests/test_catalogs.py

      - name: Commit and push if catalogs changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add manifest.json config/curated.json catalog/
            git commit -m "chore(catalogs): hebdo auto-update CinéFR Portail v4.0.0"
            git push
          else
            echo "No catalog changes detected."
          fi